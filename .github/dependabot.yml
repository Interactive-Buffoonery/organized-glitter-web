version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: '@types/node'
        versions: ['>=25']
    groups:
      posthog:
        patterns:
          - posthog-js
          - '@posthog/react'
          - '@posthog/cli'
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ['*']

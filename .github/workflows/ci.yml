name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      comparison_base:
        description: Base commit or ref for changed-source and upgrade checks
        required: false
        type: string
  schedule:
    - cron: '0 9 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Select CI scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      base_sha: ${{ steps.scope.outputs.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        name: Resolve comparison and execution plan
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_PUSH_BEFORE_SHA: ${{ github.event.before }}
          CI_EXPLICIT_BASE: ${{ inputs.comparison_base || '04789b9d000e6eb1390ca2a6ae60f855a3b1fca6' }}
          CI_BRANCH_CREATION_BASE: 04789b9d000e6eb1390ca2a6ae60f855a3b1fca6
          CI_HEAD_SHA: ${{ github.sha }}
          CI_TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: node scripts/ci-scope.mjs

  static-checks:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-project
      - run: pnpm test:ci:static

  unit-tests:
    name: Unit and server tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-project
      - run: pnpm test:ci:unit

  react-doctor:
    name: React review
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-project
      - run: pnpm test:ci:react
        env:
          CI_BASE_SHA: ${{ needs.scope.outputs.base_sha }}

  publication-security:
    name: Publication security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VITE_POCKETBASE_URL: http://127.0.0.1:8090
      VITE_APP_URL: http://127.0.0.1:3000
      VITE_APP_VERSION: ${{ github.sha }}
      APP_TEST_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-project
      - name: Build production website and enforce budget
        run: pnpm test:ci:build
      - name: Scan publication inputs, history, tree, and output
        run: pnpm test:publication

  result:
    name: CI result
    if: always()
    needs: [scope, static-checks, unit-tests, react-doctor, publication-security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every expected job to pass
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-result.mjs

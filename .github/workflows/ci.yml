name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-project
      - run: pnpm test:ci:static

  unit-tests:
    name: Unit and server tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-project
      - run: pnpm test:ci:unit

  backend:
    name: PocketBase integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-project
      - run: pnpm pb:validate:schema && pnpm pb:validate:migrations && pnpm pb:validate:upgrade && pnpm pb:test:protected-file-upgrade && pnpm pb:test:auth-verification && pnpm pb:test:feedback && pnpm pb:test:native-oauth-association && pnpm pb:test:auth-step-up && pnpm pb:test:native-apple && pnpm pb:test:archive-restore-v3 && pnpm pb:test:mobile-sync

  build:
    name: Production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VITE_POCKETBASE_URL: http://127.0.0.1:8090
      VITE_APP_URL: http://127.0.0.1:3000
      VITE_APP_VERSION: ${{ github.sha }}
      APP_TEST_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-project
      - run: pnpm build
      - run: pnpm build:budget

  react-doctor:
    name: React review
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-project
      - run: pnpm test:ci:react

  browser:
    name: Browser validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VITE_POCKETBASE_URL: http://127.0.0.1:8090
      VITE_APP_URL: http://127.0.0.1:3000
      VITE_APP_VERSION: ${{ github.sha }}
      APP_TEST_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-project
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:not-found && pnpm test:pwa:navigation && pnpm qa:browser:ci && pnpm test:protected-file-rotation-browser && pnpm qa:blog

  result:
    name: CI result
    if: always()
    needs: [static-checks, unit-tests, backend, build, browser, react-doctor]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every expected job to pass
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-result.mjs

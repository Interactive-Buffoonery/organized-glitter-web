name: Dependency security report

on:
  schedule:
    - cron: '43 8 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
      - name: Report production dependency advisories
        run: pnpm audit --prod --audit-level high --json > dependency-audit-production.json
      - name: Report all dependency advisories
        if: success() || failure()
        run: pnpm audit --audit-level high --json > dependency-audit.json
      - name: Summarize audit scope
        if: success() || failure()
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const lines = ['## Dependency security', '', '| Scope | Critical | High | Moderate |', '| --- | --- | --- | --- |'];
          for (const [scope, file] of [['Production', 'dependency-audit-production.json'], ['All dependencies', 'dependency-audit.json']]) {
            const audit = JSON.parse(readFileSync(file, 'utf8'));
            if (!audit.metadata?.vulnerabilities) throw new Error(`Incomplete audit for ${scope}`);
            const counts = audit.metadata.vulnerabilities;
            lines.push(`| ${scope} | ${counts.critical} | ${counts.high} | ${counts.moderate} |`);
          }
          lines.push('', 'Advisory counts may include multiple dependency paths. Inspect the JSON reports before remediation.');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n'));
          JS
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audit
          path: |
            dependency-audit.json
            dependency-audit-production.json
          if-no-files-found: error
          retention-days: 14

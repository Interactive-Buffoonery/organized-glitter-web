title = "Organized Glitter publication checks"

[extend]
useDefault = true

[[allowlists]]
description = "Synthetic values in logger redaction tests"
condition = "AND"
paths = ['''(^|/)src/utils/__tests__/logger\.test\.ts$''']
regexTarget = "secret"
regexes = ['''^(?:sk\-1234567890abcdef|abc123456789)$''']

[[allowlists]]
description = "Verified PocketBase SDK identifier sequence in generated sourcemap"
condition = "AND"
paths = ['''(^|/)dist/assets/pocketbase-vendor-[^/]+\.js\.map$''']
regexTarget = "secret"
regexes = ['''^this\.collections=new$''']

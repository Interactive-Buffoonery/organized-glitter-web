    <!-- Match the app theme and set PWA theme colors -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f8e8f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151533" media="(prefers-color-scheme: dark)" />
    <script src="/theme-color.js?v=8" defer></script>
    <!-- og-app-icons -->

    <!-- Apply the saved theme before first paint; unset/invalid preference follows System.
         Must run before the stylesheets so the .dark variants apply immediately. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          // next-themes uses data-theme; this bridge class supports Tailwind dark variants.
          // Mirror resolveThemePreference: legacy Catppuccin maps to light/dark; anything
          // else unrecognized (or empty) follows System like DEFAULT_THEME.
          var isLegacyDark =
            stored === 'catppuccin-frappe' ||
            stored === 'catppuccin-macchiato' ||
            stored === 'catppuccin-mocha';
          if (stored === 'catppuccin-latte') {
            localStorage.setItem('theme', 'light');
            stored = 'light';
          } else if (isLegacyDark) {
            localStorage.setItem('theme', 'dark');
            stored = 'dark';
          } else if (stored && stored !== 'light' && stored !== 'dark' && stored !== 'system') {
            // Unknown non-empty values must become `system` before next-themes
            // hydrates. Leaving `not-a-theme` in storage makes resolvedTheme
            // neither light nor dark, and ThemeClassSync would drop `.dark`.
            localStorage.setItem('theme', 'system');
            stored = 'system';
          }
          var followsSystem = stored !== 'light' && stored !== 'dark';
          var isDark =
            stored === 'dark' ||
            (followsSystem && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        } catch (e) {
          // localStorage unavailable (e.g. Safari private mode) — do nothing
        }
      })();
    </script>
    <link rel="stylesheet" href="/css/safe-area.css?v=6" />
    <!-- Static page: no app JavaScript. The build inlines critical CSS from
         src/styles/static-critical.css and the app stylesheet here. -->
    <!-- og-app-stylesheet -->
